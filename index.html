<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masukanfilenya - Konverter File Gratis</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">Masukanfilenya</div>
            <div class="nav-links">
                <a href="index.html" class="active">Konverter</a>
                <a href="about.html">Tentang</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header class="page-header">
            <h1>Konversi File Secara Lokal</h1>
            <p>Pilih atau seret file gambar Anda, lalu pilih format tujuan. Proses dilakukan 100% gratis untuk anda.</p>
        </header>

        <section class="converter-box">
            <div id="dropZone" class="drop-zone">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p>Seret dan lepas gambar di sini, atau klik untuk memilih file</p>
                <input type="file" id="fileInput" multiple accept="image/png, image/jpeg, image/webp" hidden>
            </div>

            <div class="controls">
                <div class="format-selection">
                    <label for="formatSelect">Format Tujuan:</label>
                    <select id="formatSelect">
                        <option value="image/jpeg">JPG</option>
                        <option value="image/png">PNG</option>
                        <option value="image/webp">WebP</option>
                        <option value="application/pdf">Gabung ke PDF</option>
                    </select>
                </div>
                <button id="convertBtn" class="btn-primary" disabled>Konversi & Unduh</button>
            </div>
        </section>

        <section class="preview-section">
            <h2>Pratinjau File</h2>
            <div id="previewContainer" class="preview-grid"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
